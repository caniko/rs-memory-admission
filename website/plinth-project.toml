[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Sync and async permits"
description = "The synchronous gate blocks and the Tokio gate awaits until memory allows one more job. Dropping the permit hands that slot straight back, so no separate release call is needed."

[[pages.sections.features]]
title = "Byte-weighted reservations"
description = "Weighted gates reserve the memory a job declares in bytes, so a pipeline mixing cheap work with archive extraction or media processing is bounded by memory instead of by worker slots. A job larger than the gate waits until nothing else runs, then goes alone."

[[pages.sections.features]]
title = "Three providers, one fallback"
description = "The default provider reads cgroup-v2 accounting first, then /proc/meminfo, then sysinfo on non-Linux hosts. If a provider fails at startup or at acquisition, gates log once and fall back to thread-cap-only admission rather than failing your work."

[[pages.sections.features]]
title = "Hysteresis instead of flapping"
description = "Admission pauses above the configured RAM fraction and resumes only a hysteresis band below it, so one finished task cannot push memory straight back over the limit and start a release-and-admit cycle."

[[pages.sections]]
type = "install"
id = "install"
heading = "Install"
intro = "Add the crate to a Rust project. The default features bring the sync gate, the async gate and the sysinfo provider; keeping one gate style and dropping sysinfo are Cargo feature changes."
guide_href = "/docs/getting-started/installation.html"

[[pages.sections.primary_routes]]
label = "Cargo"
audience = "Rust 1.85 and newer, default features"
href = "/docs/getting-started/installation.html#installation"
command = "cargo add memory-admission"
recommended = true

[[pages.sections.secondary_routes]]
label = "Async gate only"
audience = "Cargo.toml, smaller dependency set"
href = "/docs/getting-started/installation.html#installation"
command = 'memory-admission = { version = "0.1.7", default-features = false, features = ["async"] }'
