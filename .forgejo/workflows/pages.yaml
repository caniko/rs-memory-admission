name: Publish Pages

on:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas
    container:
      image: nixos/nix:latest
      options: --entrypoint /root/.nix-profile/bin/tail
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        substituters = https://attic.candee.baby/canix https://cache.nixos.org
        trusted-public-keys = canix:uqr0nD3I0mfj9BYfZgTZHMaDKfI2yCTtSA5JGTWKUeg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build site
        run: nix build .#site

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/rs-memory-admission/"
          token: ${{ forge.token }}
          source: result/
