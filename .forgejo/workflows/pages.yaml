name: Publish Pages

on:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas
    container: rust:1.85-bookworm
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        substituters = https://attic.candee.baby/canix https://cache.nixos.org
        trusted-public-keys = canix:uqr0nD3I0mfj9BYfZgTZHMaDKfI2yCTtSA5JGTWKUeg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Nix
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils
          mkdir -p /nix
          chmod 0755 /nix
          mkdir -p /etc/nix
          printf 'build-users-group =\nexperimental-features = nix-command flakes\n' > /etc/nix/nix.conf
          curl -L https://nixos.org/nix/install -o /tmp/install-nix.sh
          sh /tmp/install-nix.sh --no-daemon

      - name: Build site
        run: /root/.nix-profile/bin/nix build .#site

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/rs-memory-admission/"
          token: ${{ forge.token }}
          source: result/
