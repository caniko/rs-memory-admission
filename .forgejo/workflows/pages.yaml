name: Publish Pages

on:
  push:
    branches: [trunk]

jobs:
  publish:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: https://github.com/peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.2"

      - name: Build site
        run: mdbook build docs

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/rs-memory-admission/"
          token: ${{ forge.token }}
          source: docs/book/
