name: Publish Pages

on:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Provide sudo shim for root runner image
        run: |
          if ! command -v sudo >/dev/null 2>&1; then
            printf '%s\n' '#!/bin/sh' 'exec "$@"' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi

      - uses: https://github.com/cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:uqr0nD3I0mfj9BYfZgTZHMaDKfI2yCTtSA5JGTWKUeg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Build site
        run: nix build .#site

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/rs-memory-admission/"
          token: ${{ forge.token }}
          source: result/
