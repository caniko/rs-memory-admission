# Before creating and pushing a release tag, run `simit changelog release <version>` locally.
name: Publish Crate

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas
    container: rust:1.91-bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install cargo-binstall
        run: |
          base="https://raw.githubusercontent.com/cargo-bins"
          script="$base/cargo-binstall/main/install-from-binstall-release.sh"
          curl -L --proto '=https' --tlsv1.2 -sSf "$script" | bash

      - name: Install cargo tools
        run: |
          cargo binstall -y \
            cargo-audit \
            cargo-deny \
            cargo-nextest

      - name: Validate tag
        run: |
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi

          version="$(cargo metadata --no-deps --format-version 1 | grep -m1 -o '"version":"[^"]*"' | cut -d '"' -f4)"
          if [ -z "$version" ]; then
            echo "Could not read package version from cargo metadata" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match Cargo.toml package version $version" >&2
            exit 1
          fi

      - name: Test all features
        run: cargo nextest run --all-features

      - name: Test no default features
        run: cargo nextest run --no-default-features

      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- --deny warnings

      - name: Clippy no default features
        run: cargo clippy --all-targets --no-default-features -- --deny warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Package contents
        run: cargo package --list

      - name: Dependency policy
        run: cargo deny check

      - name: Dependency audit
        run: cargo audit

      - name: Dry-run publish
        run: cargo publish --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          manifest="$(cargo read-manifest)"
          package="$(printf '%s\n' "$manifest" | sed -n 's/^{"name":"\([^"]*\)".*/\1/p')"
          version="$(printf '%s\n' "$manifest" | sed -n 's/^{"name":"[^"]*","version":"\([^"]*\)".*/\1/p')"
          if [ -z "$package" ] || [ -z "$version" ]; then
            echo "Could not read package name/version from cargo metadata" >&2
            exit 1
          fi

          version_url="https://crates.io/api/v1/crates/$package/$version"
          status="$(curl -sS -o /tmp/crate-version.json -w '%{http_code}' "$version_url")"
          case "$status" in
            200)
              if grep -q '"yanked":false' /tmp/crate-version.json; then
                echo "$package@$version is already published and unyanked on crates.io; skipping upload"
                exit 0
              fi
              echo "$package@$version already exists on crates.io but is yanked; refusing sync-up upload" >&2
              exit 1
              ;;
            404)
              ;;
            *)
              echo "Could not query crates.io version $version_url (HTTP $status)" >&2
              exit 1
              ;;
          esac

          if [ -z "${CRATES_IO_API_TOKEN:-}" ] && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CRATES_IO_API_TOKEN is required to publish to crates.io" >&2
            exit 1
          fi
          export CARGO_REGISTRY_TOKEN="${CARGO_REGISTRY_TOKEN:-$CRATES_IO_API_TOKEN}"
          cargo publish
